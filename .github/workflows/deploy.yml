# Builds the component registry (and the docs site when sbt is available)
# and publishes it to GitHub Pages so the CLI can `init`/`add` from the internet:
#   npx shadcn-scalajs init
#   npx shadcn-scalajs add button
#
# Registry URL (default in the CLI):
#   https://<owner>.github.io/<repo>/registry
name: Deploy registry & site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build registry JSON
        run: node modules/site/scripts/build-registry.mjs

      - name: Stage Pages payload (registry always)
        run: |
          mkdir -p _site/registry
          cp -R modules/site/public/registry/. _site/registry/
          cat > _site/index.html << 'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>shadcn-scalajs</title>
          <body>
            <h1>shadcn-scalajs</h1>
            <p>Add Scala.js + Laminar components from this registry:</p>
            <pre>npx shadcn-scalajs init
          npx shadcn-scalajs add button</pre>
            <p>Registry index: <a href="./registry/index.json">registry/index.json</a></p>
          </body>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
