# Publish packages/cli to npm through npm Trusted Publishing (GitHub OIDC).
#
# npmjs.com Trusted Publisher configuration for shadcn-scalajs:
#   Repository owner:  lamtanloc512
#   Repository name:   shadcn-scalajs
#   Workflow filename: publish-cli.yml
#   Environment:       leave empty
name: Release CLI to npm

on:
  release:
    types: [published]

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Publish CLI package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@latest

      - name: Verify release tag and package metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_NAME="$(node --print "require('./package.json').name")"
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          EXPECTED_TAG="v$PACKAGE_VERSION"

          test "$PACKAGE_NAME" = "shadcn-scalajs" || {
            echo "Unexpected package name: $PACKAGE_NAME" >&2
            exit 1
          }
          test "$RELEASE_TAG" = "$EXPECTED_TAG" || {
            echo "Release tag $RELEASE_TAG does not match package version $EXPECTED_TAG" >&2
            exit 1
          }

          echo "Publishing $PACKAGE_NAME@$PACKAGE_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Preview package contents
        run: npm pack --dry-run

      # No NPM_TOKEN or NODE_AUTH_TOKEN is needed. npm exchanges GitHub's
      # id-token with npm using the Trusted Publisher configuration above.
      - name: Publish package
        run: npm publish --access public --provenance
