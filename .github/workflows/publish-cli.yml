# Publishes packages/cli through npm Trusted Publishing (GitHub OIDC).
#
# Required on npmjs.com → package shadcn-scalajs → Trusted Publisher:
#   Repository owner: lamtanloc512
#   Repository name:  shadcn-scalajs
#   Workflow filename: publish-cli.yml
#   Environment:      (leave empty)
#
# The npm package maintainer (currently ethandev512) must own that Trusted Publisher config.
name: Publish CLI to npm

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Job-level permissions are required for npm OIDC exchange.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v5

      # registry-url is required so npm targets registry.npmjs.org.
      # Do NOT set NODE_AUTH_TOKEN — Trusted Publishing uses OIDC instead.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - name: Upgrade npm for Trusted Publishing
        run: npm install --global npm@latest

      - name: Show npm / node versions
        run: |
          node -v
          npm -v

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION" >&2
            exit 1
          }

      - run: npm ci
      - run: npm run build

      - name: Publish package
        run: npm publish --access public --provenance
