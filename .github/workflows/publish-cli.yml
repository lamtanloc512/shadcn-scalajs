# Publishes packages/cli to npm so users can run:
#   npx shadcn-scalajs init
#   npx shadcn-scalajs add button dialog
#
# Requires repo secret NPM_TOKEN (npm access token with publish rights).
name: Publish CLI to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
