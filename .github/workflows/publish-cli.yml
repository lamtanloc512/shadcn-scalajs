# CLI release flow:
#   1. Run this workflow manually to create a draft GitHub Release.
#   2. Review it and click "Publish release".
#   3. The published-release event publishes the package to npm.
#
# npmjs.com Trusted Publisher configuration for shadcn-scalajs:
#   Repository owner:  lamtanloc512
#   Repository name:   shadcn-scalajs
#   Workflow filename: publish-cli.yml
#   Environment:       leave empty
name: Release CLI to npm

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  create-draft-release:
    name: Create draft release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install dependencies
        working-directory: packages/cli
        run: npm ci

      - name: Build and verify CLI version
        working-directory: packages/cli
        run: |
          npm run build
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          CLI_VERSION="$(node dist/index.js --version)"
          test "$CLI_VERSION" = "$PACKAGE_VERSION" || {
            echo "CLI version $CLI_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          }
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$PACKAGE_VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Git tag $TAG already exists" >&2
            exit 1
          fi

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$PACKAGE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "shadcn-scalajs v$PACKAGE_VERSION" \
            --generate-notes

  publish:
    name: Publish CLI package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Check out the published release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@latest

      - name: Verify release tag and package metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_NAME="$(node --print "require('./package.json').name")"
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          EXPECTED_TAG="v$PACKAGE_VERSION"

          test "$PACKAGE_NAME" = "shadcn-scalajs" || {
            echo "Unexpected package name: $PACKAGE_NAME" >&2
            exit 1
          }
          test "$RELEASE_TAG" = "$EXPECTED_TAG" || {
            echo "Release tag $RELEASE_TAG does not match package version $EXPECTED_TAG" >&2
            exit 1
          }

          echo "Publishing $PACKAGE_NAME@$PACKAGE_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Preview package contents
        run: npm pack --dry-run

      # No NPM_TOKEN or NODE_AUTH_TOKEN is needed. npm exchanges GitHub's
      # id-token with npm using the Trusted Publisher configuration above.
      - name: Publish package
        run: npm publish --access public --provenance
