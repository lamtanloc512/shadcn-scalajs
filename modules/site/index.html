<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Router-less multi-page app: every navigation is a real page load, and the Scala.js bundle
       (which calls ThemeConfig.applyToDocument) is deferred, so without this the page would paint
       with default styling before the persisted theme applies. This synchronous, blocking script
       mirrors ThemeConfig.applyToDocument by reading the same localStorage key directly, before any
       stylesheet or the deferred module script runs. Duplicating the attribute list here (rather
       than sharing code with the Scala side) is intentional, matching shadcn/ui's own docs site.

       It also links the active style pack. The eight packs ship as separate stylesheets (only one is
       ever active) because bundling them made every full-document style recalc — anything promoting
       an element to the top layer, e.g. dialog.showModal() — match each element against eight copies
       of the same rule. Linking it here, blocking, keeps the pack applied on first paint. -->
  <script>
    (function () {
      var pack = "nova";
      try {
        var stored = JSON.parse(localStorage.getItem("shadcn-scalajs:theme") || "{}");
        if (stored && stored.stylePack) pack = stored.stylePack;
      } catch (e) {}
      var href = "/styles/pack-" + pack + ".css";

      // Start the download now, but do not apply it yet: Vite injects the main stylesheet at the end of
      // <head>, and a pack rule only overrides the base component rule it shadows when its sheet comes
      // after. Attaching during head parsing would place it first and invert that.
      var preload = document.createElement("link");
      preload.rel = "preload";
      preload.as = "style";
      preload.href = href;
      document.head.appendChild(preload);

      // #root is empty until the deferred module runs, so nothing has painted yet and attaching the
      // (render-blocking) stylesheet here costs no flash while guaranteeing it lands last.
      document.addEventListener("DOMContentLoaded", function () {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href;
        link.setAttribute("data-style-pack-css", pack);
        document.head.appendChild(link);
      });
    })();
    (function () {
      try {
        var raw = localStorage.getItem("shadcn-scalajs:theme");
        if (!raw) return;
        var cfg = JSON.parse(raw);
        var html = document.documentElement;
        if (cfg.stylePack) html.setAttribute("data-style-pack", cfg.stylePack);
        if (cfg.baseColor) html.setAttribute("data-base-color", cfg.baseColor);
        if (cfg.themeColor) html.setAttribute("data-theme-color", cfg.themeColor);
        if (cfg.chartColor) html.setAttribute("data-chart-color", cfg.chartColor);
        if (cfg.headingFont) html.setAttribute("data-heading-font", cfg.headingFont);
        if (cfg.bodyFont) html.setAttribute("data-body-font", cfg.bodyFont);
        if (cfg.iconLibrary) html.setAttribute("data-icon-library", cfg.iconLibrary);
        if (cfg.radius) html.setAttribute("data-radius", cfg.radius);
        if (cfg.menuColor) html.setAttribute("data-menu-color", cfg.menuColor);
        if (cfg.menuAccent) html.setAttribute("data-menu-accent", cfg.menuAccent);
        if (cfg.darkMode) html.classList.add("dark");
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Figtree:wght@300..900&family=Geist:wght@100..900&family=Geist+Mono:wght@400..700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter:wght@100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Lora:ital,wght@0,400..700;1,400..700&family=Manrope:wght@200..800&family=Merriweather:ital,wght@0,300..900;1,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:wght@100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Nunito+Sans:wght@200..1000&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
  <title>shadcn-scalajs demo</title>
</head>
<body>
  <!-- Laminar mounts the demo app here, see Main.scala -->
  <div id="root"></div>
  <script type="module" src="/index.js"></script>
</body>
</html>
