[franky]
version = "0.1.0"

[models]
# Role-to-tier routing. Keep execution on `fast` and reserve `frontier` for
# planning/review, or change these tiers to fit the project and budget.
planner = "frontier"
coder = "fast"
reviewer = "frontier"

[models.escalation]
failures_before_escalate = 3

[hooks]
enabled = true

[agent]
command = "claude"
args = []
model_flag = "--model"
# Provider-specific prompt flags. Use an empty value for positional prompts or
# providers without a separate system prompt (for example codex exec).
prompt_flag = "-p"
system_prompt_flag = "--system-prompt"
max_iterations = 5

[agent.model_map]
# Replace these model IDs freely for the configured AI CLI.
# Brain tier: plans, architecture decisions, and final review.
frontier = "gpt-5.4"
# Worker tier: bounded implementation and verification slices.
fast = "gpt-5.4-mini"


# Optional: custom workspace manifest (relative to project root or absolute)
# [workspace]
# manifest = "configs/workspace.toml"