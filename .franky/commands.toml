# Franky slash commands — deterministic actions agents invoke instead of improvising shell.

[[commands]]
name = "help"
run = "franky help"
description = "Print agent instructions — run at session start"
deterministic = true

[[commands]]
name = "verify"
run = "franky verify"
description = "Run full verify harness (setup → build → lint → test)"
deterministic = true

[[commands]]
name = "verify-test"
run = "franky verify --step test"
description = "Run tests only"
deterministic = true

[[commands]]
name = "doctor"
run = "franky doctor"
description = "Health-check franky setup and scripts"
deterministic = true

[[commands]]
name = "setup"
run = "scripts/setup"
description = "Install dependencies (idempotent)"
deterministic = true

[[commands]]
name = "build"
run = "scripts/build"
description = "Compile or package"
deterministic = true

[[commands]]
name = "lint"
run = "scripts/lint"
description = "Static analysis"
deterministic = true

[[commands]]
name = "test"
run = "scripts/test"
description = "Test suite — ground truth for done"
deterministic = true

[[commands]]
name = "serve"
run = "scripts/serve"
description = "Start dev server (when configured)"
deterministic = true

[[commands]]
name = "progress"
run = "cat .franky/memory/PROGRESS.md"
description = "Show task progress (done/next/blockers)"
deterministic = true